#
# DST-09: every pull request runs lint, type-check, unit tests and browser
# tests (golden images, decoding, export) on Windows, macOS and Linux.
# End-to-end tests and the benchmark smoke join this workflow later.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Browser tests (golden images, decoding, export)
        run: npm run test:browser

      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-${{ matrix.os }}
          path: tests/golden/__output__/
          if-no-files-found: ignore

      - name: Milestone coverage
        run: node scripts/check-milestones.ts

      - name: Build
        run: npm run build

      - name: Headless export smoke (M1 demo)
        run: npm run demo
